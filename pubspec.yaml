name: luck_reveal_app
description: "Luck Reveal - App de citas místicas con Icebreaker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animaciones
  confetti: ^0.7.0
  lottie: ^2.7.0
  
  # HTTP para IA
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Utilidades
  shared_preferences: ^2.2.2
  
  # Firebase
  firebase_core: ^2.24.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
          weight: 700
